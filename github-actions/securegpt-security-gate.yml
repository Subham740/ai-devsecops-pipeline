name: SecureGPT Security Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  securegpt-gate:
    runs-on: ubuntu-latest
    env:
      FLASK_DEBUG: "False"
      DATA_BACKEND: sql
      DATABASE_PATH: /tmp/securegpt-actions.db
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SecureGPT backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run SAST and dependency scans
        run: |
          python security/scanner.py
          pip-audit -r requirements.txt -f json -o pip_audit_report.json || true
          detect-secrets scan --all-files > detect_secrets_report.json || true

      - name: Enforce critical vulnerability gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = [Path("bandit_report.json"), Path("pip_audit_report.json")]
          blocked = False
          for report in reports:
              if not report.exists():
                  continue
              data = json.loads(report.read_text(encoding="utf-8"))
              if report.name == "bandit_report.json":
                  blocked = blocked or any(item.get("issue_severity") == "HIGH" for item in data.get("results", []))
              if report.name == "pip_audit_report.json":
                  blocked = blocked or bool(data.get("dependencies"))
          if blocked:
              raise SystemExit("SecureGPT gate blocked deployment because high or critical issues were found.")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securegpt-security-reports
          path: |
            bandit_report.json
            semgrep_report.json
            pip_audit_report.json
            detect_secrets_report.json
