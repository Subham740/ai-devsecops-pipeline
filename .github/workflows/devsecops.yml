name: DevSecOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run SAST scans
        run: python security/scanner.py

      - name: Run dependency scan
        run: safety check -r requirements.txt --save-json safety_report.json || true

      - name: Start app for DAST
        run: |
          DATA_BACKEND=sql DATABASE_PATH=/tmp/devsecops-ci.db HOST=127.0.0.1 PORT=5000 FLASK_DEBUG=False python run.py > flask_ci.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:5000/health && exit 0
            sleep 2
          done
          cat flask_ci.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: python security/zap_scan.py
        env:
          APP_URL: http://host.docker.internal:5000
          ZAP_ALLOW_FAILURE: "true"

      - name: Generate AI remediation guidance report
        run: python security/ai_remediation.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}

      - name: Build Docker image
        run: docker build -t devsecops-app .

      - name: Container security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          if-no-files-found: warn
          path: |
            bandit_report.json
            semgrep_report.json
            safety_report.json
            zap_report.html
            remediation_report.md

  remediation-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate remediation branch content
        run: python security/remediation_pr.py

      - name: Open remediation pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/remediation-updates
          title: Automated remediation updates
          commit-message: Generate automated remediation summary
          body: |
            This PR was generated by the DevSecOps remediation workflow.

            Review the report, apply validated code fixes, and rerun Semgrep, Trivy, and OWASP ZAP before merging.
          labels: security, automated-remediation
